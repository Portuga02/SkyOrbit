<div class="orbit-shell">

  <aside class="sidebar">
    <div class="sidebar-header">
      <ion-icon name="moon" class="logo-icon"></ion-icon>
      <div class="logo-text">
        <span class="logo-title">SkyOrbit</span>
        <span class="logo-sub">Gestão &amp; Psicologia</span>
      </div>
    </div>

    <div class="profile-row">
      <div class="profile-avatar">{{ professionalName.charAt(0) }}</div>
      <div class="profile-text">
        <span class="profile-name">{{ professionalName }}</span>
        <span class="profile-role">{{ professionalRole }}</span>
      </div>
      <span class="online-dot"></span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" class="nav-item" [class.active]="activeTab === 'dashboard'">
        <ion-icon name="grid-outline"></ion-icon><span>Dashboard</span>
      </a>
      <a routerLink="/patients" class="nav-item" [class.active]="activeTab === 'patients'">
        <ion-icon name="people-outline"></ion-icon><span>Pacientes</span>
      </a>
      <a routerLink="/agenda" class="nav-item" [class.active]="activeTab === 'agenda'">
        <ion-icon name="calendar-outline"></ion-icon><span>Agenda</span>
      </a>
      <a class="nav-item" [class.active]="activeTab === 'records'">
        <ion-icon name="document-text-outline"></ion-icon><span>Prontuários</span>
      </a>
      <a routerLink="/teleatendimento" class="nav-item" [class.active]="activeTab === 'teleatendimento'">
        <ion-icon name="videocam-outline"></ion-icon><span>Teleatendimento</span>
      </a>
      <a routerLink="/financeiro" class="nav-item" [class.active]="activeTab === 'financeiro'">
        <ion-icon name="cash-outline"></ion-icon><span>Financeiro</span>
      </a>
      <a class="nav-item" [class.active]="activeTab === 'documents'">
        <ion-icon name="folder-outline"></ion-icon><span>Documentos</span>
      </a>
      <a class="nav-item" [class.active]="activeTab === 'reports'">
        <ion-icon name="bar-chart-outline"></ion-icon><span>Relatórios</span>
      </a>
      <a routerLink="/settings" class="nav-item" [class.active]="activeTab === 'settings'">
        <ion-icon name="settings-outline"></ion-icon><span>Configurações</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <ion-icon name="moon-outline"></ion-icon>
      <span>Conecte-se. Cuide.<br>Transforme vidas.</span>
    </div>
  </aside>

  <div class="mobile-topbar">
    <ion-icon name="moon"></ion-icon>
    <span>SkyOrbit</span>
    <button class="icon-btn" aria-label="Menu">
      <ion-icon name="menu-outline"></ion-icon>
    </button>
  </div>

  <div class="shell-content">
    <ng-content></ng-content>
  </div>

</div>
