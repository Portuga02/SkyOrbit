<app-orbit-shell activeTab="patients">

  <ion-content class="patients-page">
    <div class="patients-wrap">

      <div class="page-header">
        <div>
          <h1>Pacientes</h1>
          <p>{{ patients.length }} pacientes cadastrados</p>
        </div>
        <ion-button class="btn-new" shape="round">
          <ion-icon name="person-add-outline" slot="start"></ion-icon>
          Novo paciente
        </ion-button>
      </div>

      <div class="search-row">
        <ion-searchbar
          [(ngModel)]="searchTerm"
          placeholder="Buscar paciente"
          class="orbit-search"
          show-clear-button="focus">
        </ion-searchbar>
      </div>

      <div class="patients-table">
        <div class="table-head">
          <span>Paciente</span>
          <span>Status</span>
          <span>Última sessão</span>
          <span></span>
        </div>

        <div class="table-row" *ngFor="let p of filtered" (click)="openPatient(p)">
          <div class="patient-cell">
            <div class="avatar" [style.background]="p.avatarColor">{{ p.name.charAt(0) }}</div>
            <div class="patient-name-block">
              <span class="patient-name">{{ p.name }}</span>
              <span class="patient-age">{{ p.age }} anos</span>
            </div>
          </div>
          <span class="status-badge" [class.inactive]="p.status === 'Inativa'">{{ p.status }}</span>
          <span class="last-session">{{ p.lastSession }}</span>
          <ion-icon name="chevron-forward-outline" class="row-arrow"></ion-icon>
        </div>
      </div>

    </div>
  </ion-content>

</app-orbit-shell>
