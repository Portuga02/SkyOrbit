<app-orbit-shell activeTab="reports">

  <ion-content class="reports-page">
    <div class="reports-wrap">

      <div class="page-header">
        <h1>Relatórios</h1>
        <p>Emita declarações e relatórios em PDF</p>
      </div>

      <div class="filters-panel">
        <div class="field">
          <label>Paciente (opcional)</label>
          <ion-select [(ngModel)]="selectedPatient" placeholder="Todos os pacientes" interface="popover" class="orbit-select">
            <ion-select-option *ngFor="let p of patients" [value]="p">{{ p }}</ion-select-option>
          </ion-select>
        </div>
        <div class="field">
          <label>De</label>
          <ion-input type="date" [(ngModel)]="startDate"></ion-input>
        </div>
        <div class="field">
          <label>Até</label>
          <ion-input type="date" [(ngModel)]="endDate"></ion-input>
        </div>
      </div>

      <div class="reports-grid">
        <div class="report-card" *ngFor="let r of reportTypes">
          <div class="report-icon"><ion-icon [name]="r.icon"></ion-icon></div>
          <div class="report-info">
            <span class="report-title">{{ r.title }}</span>
            <span class="report-desc">{{ r.description }}</span>
          </div>
          <ion-button
            class="btn-generate"
            [disabled]="generating === r.id"
            (click)="generate(r.id)">
            <ion-spinner *ngIf="generating === r.id" name="crescent"></ion-spinner>
            <span *ngIf="generating !== r.id">
              <ion-icon name="download-outline" slot="start"></ion-icon> Gerar PDF
            </span>
          </ion-button>
        </div>
      </div>

      <div class="legal-note">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
        <p>Cada tipo de documento segue as regras do CFP quanto ao nível de detalhe permitido — a declaração de comparecimento nunca revela conteúdo clínico, diferente do relatório psicológico completo.</p>
      </div>

    </div>
  </ion-content>

</app-orbit-shell>
