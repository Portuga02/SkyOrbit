<app-orbit-shell activeTab="settings">

  <ion-content class="orbit-settings-page">
    <div class="settings-wrap">

      <div class="page-header">
        <h1>Configurações</h1>
        <ion-button fill="outline" size="small" (click)="toggleEdit()">
          <ion-icon [name]="editing ? 'close-outline' : 'create-outline'" slot="start"></ion-icon>
          {{ editing ? 'Cancelar' : 'Editar' }}
        </ion-button>
      </div>

      <div class="panel">
        <h2>Dados profissionais</h2>

        <div class="field-row">
          <label>Nome</label>
          <ion-input *ngIf="editing" [(ngModel)]="name" class="edit-input"></ion-input>
          <p *ngIf="!editing">{{ name }}</p>
        </div>

        <div class="field-row">
          <label>E-mail</label>
          <p class="readonly">{{ email }}</p>
        </div>

        <div class="field-row">
          <label>Registro (CRP)</label>
          <ion-input *ngIf="editing" [(ngModel)]="crp" class="edit-input"></ion-input>
          <p *ngIf="!editing">{{ crp }}</p>
        </div>

        <ion-button expand="block" shape="round" class="btn-save" *ngIf="editing" (click)="save()">
          Salvar alterações
        </ion-button>
      </div>

      <div class="panel">
        <h2>Notificações</h2>
        <div class="toggle-row">
          <span>Notificações por e-mail</span>
          <ion-toggle [(ngModel)]="notifyEmail"></ion-toggle>
        </div>
        <div class="toggle-row">
          <span>Notificações por SMS</span>
          <ion-toggle [(ngModel)]="notifySms"></ion-toggle>
        </div>
      </div>

    </div>
  </ion-content>

</app-orbit-shell>
